# Version flow: bump `version` in mirutime-core/build.gradle.kts → commit →
# tag `vX.Y.Z` → `git push origin vX.Y.Z` → this Action verifies the tag and
# creates the GitHub Release itself (auto-generated notes + AAR/JAR) →
# JitPack builds the tag and serves the AAR/JAR. No manual Release clicks.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches jitpack.yml (openjdk17); the lib targets JVM 17 bytecode.
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Verify JVM tests and assemble Android AAR + JVM JAR
        run: ./gradlew :mirutime-core:jvmTest :mirutime-core:jvmJar :mirutime-core:assembleAndroidMain
      - name: Upload AAR and JVM JAR
        uses: actions/upload-artifact@v4
        with:
          name: mirutime-core-artifacts
          path: |
            mirutime-core/build/outputs/aar/*.aar
            mirutime-core/build/libs/*-jvm-*.jar
      - name: Create GitHub Release with AAR and JVM JAR
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mirutime-core/build/outputs/aar/*.aar
            mirutime-core/build/libs/*-jvm-*.jar
          fail_on_unmatched_files: true
